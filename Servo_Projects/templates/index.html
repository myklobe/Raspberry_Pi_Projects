<!DOCTYPE html>
<html>
<head>
    <title>Servo Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; background: #2c3e50; color: white; }
        .container { margin-top: 50px; }
        .servo-box { border: 2px solid #ecf0f1; padding: 20px; margin: 20px; border-radius: 10px; display: inline-block; }
        button { padding: 15px 25px; font-size: 18px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; background: #3498db; color: white; }
        button:active { background: #2980b9; }
        .both-box { margin-top: 30px; border: 2px solid #e74c3c; }
        .both-btn { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Servo Controller</h1>

        <div class="servo-box">
            <h2>Servo 1</h2>
            <button onclick="move('1', '0')">0°</button>
            <button onclick="move('1', '45')">45°</button>
            <button onclick="move('1', '90')">90°</button>
            <button onclick="move('1', '135')">135°</button>
            <button onclick="move('1', '180')">180°</button>
        </div>

        <div class="servo-box">
            <h2>Servo 2</h2>
            <button onclick="move('2', '0')">0°</button>
            <button onclick="move('2', '45')">45°</button>
            <button onclick="move('2', '90')">90°</button>
            <button onclick="move('2', '135')">135°</button>
            <button onclick="move('2', '180')">180°</button>
        </div>

        <div class="servo-box both-box">
            <h2>Both Servos</h2>
            <button class="both-btn" onclick="move('both', '0')">0°</button>
            <button class="both-btn" onclick="move('both', '45')">45°</button>
            <button class="both-btn" onclick="move('both', '90')">90°</button>
            <button class="both-btn" onclick="move('both', '135')">135°</button>
            <button class="both-btn" onclick="move('both', '180')">180°</button>
        </div>
    </div>

    <script>
        function move(servo, angle) {
            // This sends a request to the Python backend without refreshing the page
            fetch(`/move?servo=${servo}&angle=${angle}`)
                .then(response => console.log(`Moved to ${angle}`));
        }
    </script>
</body>
</html>
